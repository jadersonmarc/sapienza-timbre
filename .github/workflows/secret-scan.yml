name: Secret scan (gitleaks)

# Barra segredos versionados (repo público): varre toda a história a cada push/PR e
# falha se achar credencial. Saída redigida (não imprime o segredo). Rode local antes
# de commitar: gitleaks detect --redact
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          V=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --redact --exit-code 1 --verbose
