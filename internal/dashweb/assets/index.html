<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E73">
<title>Timbre — Painel</title>
<style>
  :root{--petrol:#0E6E73;--ink:#0b1220;--card:#111c2b;--mut:#7b8794;--ok:#3a9ba0}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--ink);color:#eef2f5}
  header{padding:12px 16px;background:var(--petrol);font-weight:700;display:flex;justify-content:space-between;align-items:center}
  main{padding:16px;max-width:640px;margin:0 auto}
  input,button,select{font-size:16px;padding:12px;border-radius:10px;border:1px solid #2a3340;width:100%}
  input,select{background:#0f1826;color:#eef2f5;margin:6px 0}
  button{background:var(--petrol);color:#fff;border:none;font-weight:700;margin-top:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .card{background:var(--card);border-radius:14px;padding:14px}
  .card .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .card .v{font-size:24px;font-weight:800;margin-top:4px}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #202b3a}
  .bar{height:8px;background:#202b3a;border-radius:99px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--ok)}
  a{color:var(--ok)} .muted{color:var(--mut);font-size:13px} .hide{display:none}
</style>
</head>
<body>
<header><span>Timbre · Painel</span><span id="live" class="muted">—</span></header>
<main>
  <section id="loginView">
    <p class="muted">Entre com um colaborador com permissão <b>relatórios</b>.</p>
    <input id="email" type="email" placeholder="e-mail" autocomplete="username">
    <input id="password" type="password" placeholder="senha" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <p id="loginErr" class="muted"></p>
  </section>

  <section id="dashView" class="hide">
    <select id="eventSel"><option value="">— selecione o evento —</option></select>
    <div id="panel" class="hide">
      <div class="grid">
        <div class="card"><div class="k">Receita líquida</div><div class="v" id="repasse">—</div></div>
        <div class="card"><div class="k">Bruto</div><div class="v" id="gross">—</div></div>
        <div class="card"><div class="k">Taxa</div><div class="v" id="taxa">—</div></div>
        <div class="card"><div class="k">Ingressos</div><div class="v" id="tickets">—</div></div>
      </div>
      <div class="card"><div class="k">Ocupação do mapa</div><div class="v" id="occv">—</div><div class="bar"><i id="occbar" style="width:0"></i></div></div>
      <div class="card" style="margin-top:10px"><div class="k">Check-in</div><div class="v" id="chkv">—</div><div class="bar"><i id="chkbar" style="width:0"></i></div></div>
      <h3 style="margin:16px 0 4px">Curva por lote</h3>
      <table><thead><tr><th>Lote</th><th>Vendidos</th><th>Receita</th></tr></thead><tbody id="lots"></tbody></table>
      <p style="margin-top:12px"><a id="csv" href="#">Exportar CSV</a> · <a href="#" id="logout">sair</a></p>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
