<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E73">
<link rel="manifest" href="manifest.webmanifest">
<title>Timbre — Portaria</title>
<style>
  :root { --petrol:#0E6E73; --ink:#0b1220; --ok:#1a7f4b; --dup:#b4881f; --bad:#b33a3a; --mut:#5b6470; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--ink); color:#eef2f5; }
  header { padding:12px 16px; background:var(--petrol); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  #net { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:#0006; }
  main { padding:16px; max-width:560px; margin:0 auto; }
  input,button,select { font-size:16px; padding:12px; border-radius:10px; border:1px solid #2a3340; width:100%; }
  input,select { background:#0f1826; color:#eef2f5; margin:6px 0; }
  button { background:var(--petrol); color:#fff; border:none; font-weight:700; margin-top:8px; }
  button.ghost { background:#1a2331; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  #verdict { border-radius:14px; padding:22px 16px; text-align:center; margin:14px 0; display:none; }
  #verdict .v { font-size:30px; font-weight:800; letter-spacing:.5px; }
  #verdict .seat { font-size:20px; margin-top:6px; }
  .admitted{background:var(--ok)} .reentry{background:#256}.duplicate{background:var(--dup);color:#111}.invalid,.unknown{background:var(--bad)}
  #cam { width:100%; border-radius:12px; background:#000; aspect-ratio:1/1; object-fit:cover; display:none; }
  .muted{color:var(--mut);font-size:13px}
  .hide{display:none}
  #queue{font-size:13px;color:var(--mut);margin-top:10px}
</style>
</head>
<body>
<header><span>Timbre · Portaria</span><span id="net">—</span></header>
<main>
  <section id="loginView">
    <p class="muted">Entre com um colaborador que tenha a permissão <b>check-in</b>.</p>
    <input id="email" type="email" placeholder="e-mail" autocomplete="username">
    <input id="password" type="password" placeholder="senha" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <p id="loginErr" class="muted"></p>
  </section>

  <section id="gateView" class="hide">
    <div class="row">
      <input id="gateName" placeholder="portão (ex.: G1)" value="G1">
      <select id="eventSel"><option value="">— evento (mapa) —</option></select>
    </div>
    <div id="verdict"><div class="v"></div><div class="seat"></div></div>
    <video id="cam" playsinline></video>
    <button id="scanBtn">Escanear QR</button>
    <details><summary class="muted">Sem câmera? Colar código</summary>
      <textarea id="manual" rows="2" placeholder="cole o token do QR" style="width:100%"></textarea>
      <button class="ghost" id="manualBtn">Validar código</button>
    </details>
    <div class="row" style="margin-top:12px">
      <button class="ghost" id="syncBtn">Sincronizar</button>
      <button class="ghost" id="logoutBtn">Sair</button>
    </div>
    <div id="queue"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
